# Deploy DESACTIVADO — se hace manual: npm run build + git push
# Para reactivar: cambiar 'workflow_dispatch' por 'push: branches: [main]'
name: Build and Deploy (manual)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build project
      run: npm run build
    - name: Copy dist to root
      run: cp -r dist/* .
    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "Manual deploy [skip ci]"
        git push origin main
